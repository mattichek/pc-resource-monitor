<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Zasobów Komputera - Historia</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div id="alert-bar">
        <div class="alert-container">
            <span id="alert-cpu" class="alert-item">CPU: <span class="alert-value">OK</span></span>
            <span id="alert-ram" class="alert-item">RAM: <span class="alert-value">OK</span></span>
            <span id="alert-disk" class="alert-item">Dysk: <span class="alert-value">OK</span></span>
            <span id="alert-gpu" class="alert-item">GPU: <span class="alert-value">OK</span></span>
            <span id="alert-gpu-temp" class="alert-item">GPU Temp: <span class="alert-value">OK</span></span>
        </div>
    </div>
    
    <div class="container-charts">
        <h1>Monitor Zasobów Komputera - Historia</h1>

        <div class="history-controls">
            <label for="readout-select">Wybierz odczyt:</label>
            <select id="readout-select"></select>
            <button id="load-readout-button">Załaduj odczyt</button>
            <button id="delete-readout-button" class="delete-button">Usuń wybrany odczyt</button>
        </div>

        <div class="chart-grid" id="main-chart-grid">
            <div class="chart-card">
                <h2>% Wykorzystania Podzespołów</h2>
                <div class="chart-container-large">
                    <canvas id="perfCombinedChart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h2>Niewykorzystana Pamięć RAM</h2>
                <div class="chart-container-large">
                    <canvas id="ramFreeChart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h2>Ruch Sieciowy</h2>
                <div class="chart-container-large">
                    <canvas id="netCombinedChart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h2>Aktywne Połączenia Sieciowe</h2>
                <div class="chart-container-large">
                    <canvas id="netConnectionsChart"></canvas>
                </div>
            </div>
            
            <!-- <div id="gpu-chart-container"></div> -->
        </div>

        <div class="button-row">
            <button class="back-button" onclick="location.href='/'">Powrót do Monitora</button>
            <button class="back-button" onclick="location.href='/charts'">Pokaż wykresy Live</button>
        </div>

        <div class="footer">
            <p>ZSI Monitor Zasobów Komputera | Autorzy: Mateusz Zaskórski, Jakub Kwaśniewski, Patryk Hałacz, Patryk Foja</p>
        </div>

    </div>

    <script src="{{ url_for('static', filename='js/history-charts-script.js') }}"></script>
</body>
</html>
